<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" role="img">
  <title>GitHub: separate reads from durability</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#3979a8" />
    </marker>
  </defs>
  <rect width="720" height="680" rx="18" fill="#f3f7fa" />
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="32" y="48" text-anchor="start" font-size="27" fill="#18334b">GitHub: separate reads from durability</text>
    <text x="32" y="83" text-anchor="start" font-size="18" fill="#526b80">The virtual-replica bridge described on October 21</text>
    <rect x="140" y="118" width="440" height="70" rx="12" fill="#fff" stroke="#9eb4c6" stroke-width="2" />
    <text x="360.0" y="160.0" text-anchor="middle" font-size="22" fill="#18334b">Git clients — same protocol</text>
    <path d="M190 188V256" fill="none" stroke="#3979a8" stroke-width="3" marker-end="url(#arrow)" />
    <path d="M535 188V256" fill="none" stroke="#3979a8" stroke-width="3" marker-end="url(#arrow)" />
    <text x="150" y="235" text-anchor="middle" font-size="19" fill="#18334b">push</text>
    <text x="555" y="235" text-anchor="start" font-size="19" fill="#18334b">fetch</text>
    <rect x="35" y="262" width="310" height="106" rx="12" fill="#e0edf9" stroke="#3979a8" stroke-width="2" />
    <text x="190.0" y="292.0" text-anchor="middle" font-size="22" fill="#18334b">Write quorum</text>
    <text x="190.0" y="322.0" text-anchor="middle" font-size="22" fill="#18334b">Includes a virtual</text>
    <text x="190.0" y="352.0" text-anchor="middle" font-size="22" fill="#18334b">write replica</text>
    <rect x="385" y="262" width="300" height="106" rx="12" fill="#fff" stroke="#9eb4c6" stroke-width="2" />
    <text x="535.0" y="292.0" text-anchor="middle" font-size="20" fill="#18334b">Virtual read replicas</text>
    <text x="535.0" y="322.0" text-anchor="middle" font-size="22" fill="#18334b">Local caches</text>
    <text x="535.0" y="352.0" text-anchor="middle" font-size="22" fill="#18334b">Outside the quorum</text>
    <path d="M190 368V470" fill="none" stroke="#3979a8" stroke-width="3" marker-end="url(#arrow)" />
    <text x="275" y="410" text-anchor="middle" font-size="19" fill="#18334b">persist</text>
    <text x="275" y="438" text-anchor="middle" font-size="18" fill="#18334b">before ack</text>
    <path d="M530 470V373" fill="none" stroke="#3979a8" stroke-width="3" marker-end="url(#arrow)" />
    <text x="550" y="415" text-anchor="start" font-size="17" fill="#18334b">warm /</text>
    <text x="550" y="441" text-anchor="start" font-size="17" fill="#18334b">reconcile</text>
    <rect x="100" y="475" width="520" height="95" rx="12" fill="#dfefe9" stroke="#508578" stroke-width="2" />
    <text x="360.0" y="514.5" text-anchor="middle" font-size="22" fill="#18334b">Azure Blob Storage</text>
    <text x="360.0" y="544.5" text-anchor="middle" font-size="22" fill="#18334b">Durable repository data</text>
    <text x="360" y="617" text-anchor="middle" font-size="21" fill="#18334b">Read capacity can grow independently.</text>
    <text x="360" y="649" text-anchor="middle" font-size="18" fill="#526b80">Initially: selected read workloads only.</text>
  </g>
</svg>
